name: 仓库检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 保留检查项名称，兼容当前 GitHub 主分支保护。
  prototype-check:
    name: prototype-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 检查文档链接和仓库文件
        run: python3 .github/scripts/check_repository.py
